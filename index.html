<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marahuyo Photo Booth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #1f2937; }
        .font-brand { font-family: 'Playfair Display', serif; }
        .material-icons { vertical-align: middle; }
        .fade-in { animation: fadeIn 0.6s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .flash { animation: flash 0.3s ease-out; }
        @keyframes flash { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
        .preview-slot img { animation: popIn 0.3s ease-out; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="text-white flex items-center justify-center min-h-screen font-sans overflow-hidden p-2 sm:p-4">

    <div class="container mx-auto text-center w-full max-w-6xl">

        <!-- ===== START SCREEN ===== -->
        <div id="start-screen" class="bg-gray-900 rounded-2xl shadow-2xl p-6 md:p-8 fade-in max-w-5xl mx-auto">
            <h1 class="font-brand text-6xl md:text-7xl text-amber-400">Marahuyo</h1>
            <p class="text-gray-300 mb-2 text-lg">Enchanting Moments, Captured.</p>
            <h2 class="text-2xl font-semibold mb-6 text-gray-200">1. Choose Your Photo Layout</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                
                <!-- Strip (3 Shots) -->
                <button data-layout="strip-3" class="layout-btn group bg-gray-800 p-4 rounded-lg border-2 border-gray-700 hover:border-amber-400 transition-all duration-300 transform hover:scale-105">
                    <div class="flex flex-col items-center h-full">
                        <div class="w-16 h-48 border-2 border-gray-600 group-hover:border-amber-300 rounded-md flex flex-col justify-around p-1 flex-grow">
                            <div class="h-1/3 bg-gray-600 group-hover:bg-amber-400 rounded-sm"></div>
                            <div class="h-1/3 bg-gray-600 group-hover:bg-amber-400 rounded-sm"></div>
                            <div class="h-1/3 bg-gray-600 group-hover:bg-amber-400 rounded-sm"></div>
                        </div>
                        <h3 class="text-xl font-semibold mt-4">Photo Strip</h3>
                        <p class="text-sm text-gray-400">3 Shots (2x6")</p>
                    </div>
                </button>

                <!-- Strip (4 Shots) - NEW & FIXED -->
                <button data-layout="strip-4" class="layout-btn group bg-gray-800 p-4 rounded-lg border-2 border-gray-700 hover:border-amber-400 transition-all duration-300 transform hover:scale-105">
                    <div class="flex flex-col items-center h-full">
                        <div class="w-16 h-48 border-2 border-gray-600 group-hover:border-amber-300 rounded-md flex flex-col justify-around p-1 flex-grow">
                            <div class="h-1/4 bg-gray-600 group-hover:bg-amber-400 rounded-sm"></div>
                            <div class="h-1/4 bg-gray-600 group-hover:bg-amber-400 rounded-sm"></div>
                            <div class="h-1/4 bg-gray-600 group-hover:bg-amber-400 rounded-sm"></div>
                            <div class="h-1/4 bg-gray-600 group-hover:bg-amber-400 rounded-sm"></div>
                        </div>
                        <h3 class="text-xl font-semibold mt-4">Long Strip</h3>
                        <p class="text-sm text-gray-400">4 Shots (2x8")</p>
                    </div>
                </button>

                <!-- Grid (4 Shots) -->
                <button data-layout="grid-4" class="layout-btn group bg-gray-800 p-4 rounded-lg border-2 border-gray-700 hover:border-amber-400 transition-all duration-300 transform hover:scale-105">
                    <div class="flex flex-col items-center h-full">
                        <div class="w-32 h-48 border-2 border-gray-600 group-hover:border-amber-300 rounded-md grid grid-cols-2 grid-rows-2 gap-1 p-1 flex-grow">
                            <div class="bg-gray-600 group-hover:bg-amber-400 rounded-sm"></div>
                            <div class="bg-gray-600 group-hover:bg-amber-400 rounded-sm"></div>
                            <div class="bg-gray-600 group-hover:bg-amber-400 rounded-sm"></div>
                            <div class="bg-gray-600 group-hover:bg-amber-400 rounded-sm"></div>
                        </div>
                        <h3 class="text-xl font-semibold mt-4">Grid</h3>
                        <p class="text-sm text-gray-400">4 Shots (4x6")</p>
                    </div>
                </button>
                
                <!-- Spotlight (3 Shots) -->
                <button data-layout="spotlight-3" class="layout-btn group bg-gray-800 p-4 rounded-lg border-2 border-gray-700 hover:border-amber-400 transition-all duration-300 transform hover:scale-105">
                    <div class="flex flex-col items-center h-full">
                        <div class="w-48 h-32 border-2 border-gray-600 group-hover:border-amber-300 rounded-md flex gap-1 p-1 flex-grow">
                            <div class="w-2/3 h-full bg-gray-600 group-hover:bg-amber-400 rounded-sm"></div>
                            <div class="w-1/3 h-full flex flex-col gap-1">
                                <div class="h-1/2 bg-gray-600 group-hover:bg-amber-400 rounded-sm"></div>
                                <div class="h-1/2 bg-gray-600 group-hover:bg-amber-400 rounded-sm"></div>
                            </div>
                        </div>
                        <h3 class="text-xl font-semibold mt-4">Spotlight</h3>
                        <p class="text-sm text-gray-400">3 Shots (6x4")</p>
                    </div>
                </button>

            </div>
        </div>

        <!-- The rest of the screens (frame-screen, booth-screen, etc.) remain exactly the same -->
        <div id="frame-screen" class="hidden bg-gray-900 rounded-2xl shadow-2xl p-6 md:p-8 max-w-5xl mx-auto"><h2 class="text-2xl font-semibold mb-6 text-gray-200">2. Choose a Frame</h2><div id="frame-options-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"><button data-frame="none" class="frame-btn group bg-gray-800 p-4 rounded-lg border-2 border-gray-700 hover:border-amber-400 transition-all duration-300 transform hover:-translate-y-2 flex flex-col items-center justify-center"><span class="material-icons text-5xl text-gray-500 group-hover:text-amber-300">block</span><h3 class="text-lg font-semibold mt-3">No Frame</h3></button></div><button id="back-to-start-btn" class="mt-8 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-full inline-flex items-center gap-2 transition-colors"><span class="material-icons">arrow_back</span> Back to Layouts</button></div>
        <div id="booth-screen" class="hidden bg-gray-900 rounded-2xl shadow-2xl p-6 md:p-8"><div class="flex justify-between items-center mb-4"><button id="back-to-layout-btn" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-full inline-flex items-center gap-2 transition-colors"><span class="material-icons">arrow_back</span>Back</button><div id="shot-indicator" class="text-2xl font-semibold text-amber-400 h-8"></div><div class="w-28"></div></div><div class="flex flex-col md:flex-row gap-6 items-start"><div class="w-full md:w-2/3"><div class="relative w-full mx-auto border-4 border-gray-700 rounded-lg overflow-hidden"><video id="camera-feed" class="w-full h-auto" autoplay playsinline></video><div id="flash-effect" class="absolute inset-0 bg-white opacity-0" style="pointer-events:none;"></div><div id="overlay-text" class="absolute inset-0 flex items-center justify-center bg-black/70 text-5xl md:text-8xl font-bold text-white" style="display:none;"></div></div></div><div class="w-full md:w-1/3 bg-gray-800/50 rounded-lg p-4"><h3 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">Your Shots</h3><div id="shot-previews-container" class="space-y-4"></div></div></div><div class="mt-6"><button id="start-capture-btn" class="bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-3 px-10 rounded-full text-xl transition-all transform hover:scale-105">Start</button></div></div>
        <div id="preview-screen" class="hidden bg-gray-900 rounded-2xl shadow-2xl p-6 md:p-8 max-w-4xl mx-auto"><h2 class="text-3xl font-semibold mb-1">Looking Good?</h2><p class="text-gray-400 mb-4">Save your masterpiece or retake the shots.</p><div id="preview-container" class="bg-gray-800 p-4 rounded-md mb-6 max-h-[60vh] overflow-y-auto"></div><div class="flex justify-center flex-wrap gap-4"><button id="retake-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-8 rounded-full text-lg inline-flex items-center gap-2"><span class="material-icons">refresh</span>Retake</button><button id="confirm-save-btn" class="bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-3 px-8 rounded-full text-lg inline-flex items-center gap-2"><span class="material-icons">check_circle</span>Save It!</button></div></div>
        <div id="result-screen" class="hidden bg-gray-900 rounded-2xl shadow-2xl p-6 md:p-8 max-w-4xl mx-auto"><h2 class="text-3xl font-bold text-green-400 mb-2">Saved Successfully!</h2><p class="text-gray-400 mb-4">Here is your Marahuyo moment.</p><div id="result-container" class="bg-gray-800 p-4 rounded-md mb-6 max-h-[60vh] overflow-y-auto"></div><div class="flex justify-center flex-wrap gap-4"><button id="restart-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-8 rounded-full text-lg inline-flex items-center gap-2"><span class="material-icons">replay</span>Start Over</button><a id="download-btn" href="#" download="marahuyo-photobooth.png" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full text-lg inline-flex items-center gap-2"><span class="material-icons">download</span>Download</a><button id="print-btn" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-8 rounded-full text-lg inline-flex items-center gap-2"><span class="material-icons">print</span>Print</button></div></div>

    </div>

    <canvas id="capture-canvas" class="hidden"></canvas>
    <canvas id="final-canvas" class="hidden"></canvas>
    
    <script src="js/main.js"></script>
</body>
</html>
