<style>
    /* --- GLOBAL THEME --- */
    body { 
        font-family: 'Poppins', sans-serif; 
        background-color: #050505;
        background-image: 
            radial-gradient(circle at 50% 0%, #450a0a 0%, transparent 60%),
            linear-gradient(0deg, #000000 0%, #1a0505 100%);
        background-attachment: fixed;
        overflow-x: hidden;
    }

    /* --- UTILITIES --- */
    .font-poppins { font-family: 'Poppins', sans-serif; }
    
    .photobooth-card {
        background: rgba(10, 10, 10, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(220, 38, 38, 0.3);
        box-shadow: 0 0 40px rgba(220, 38, 38, 0.15);
        border-radius: 24px;
    }

    /* --- ANIMATIONS --- */
    .fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .zoom-in { animation: zoomIn 0.4s ease-out forwards; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    
    .flash { animation: flash 0.2s ease-out; }
    @keyframes flash { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

    /* --- BUTTONS --- */
    .btn {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 9999px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: scale(0.98); }

    .btn-primary {
        background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
        color: white;
        box-shadow: 0 4px 20px rgba(220, 38, 38, 0.4);
        border: 1px solid #ef4444;
    }
    .btn-primary:hover {
        box-shadow: 0 6px 30px rgba(220, 38, 38, 0.6);
        filter: brightness(1.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.05);
        color: #e5e5e5;
        border: 1px solid #525252;
    }
    .btn-secondary:hover {
        background: rgba(255,255,255,0.1);
        border-color: #ef4444;
        color: white;
    }

    /* --- CHOICE CARDS --- */
    .btn-choice {
        transition: all 0.3s ease;
        border: 2px solid #262626;
        background: linear-gradient(180deg, #171717 0%, #0a0a0a 100%);
        position: relative;
        overflow: hidden;
    }
    .btn-choice:not(:disabled):hover {
        transform: translateY(-5px);
        border-color: #ef4444;
        box-shadow: 0 10px 30px -5px rgba(220, 38, 38, 0.3);
    }
    .btn-choice:not(:disabled):hover .preview-paper { background-color: #ffffff; }
    .btn-choice:not(:disabled):hover .preview-slot { background-color: #ef4444; }
    
    .btn-choice.selected {
        border-color: #ef4444;
        box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2);
    }

    .btn-choice:disabled {
        opacity: 0.4;
        filter: grayscale(100%);
        cursor: not-allowed;
    }

    .preview-paper {
        background-color: #e5e5e5; 
        transition: background-color 0.3s;
        box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    .preview-slot {
        background-color: #262626; 
        transition: background-color 0.3s;
    }

    .layout-counter {
        position: absolute;
        top: 10px;
        right: 10px;
        background-color: #ef4444;
        color: white;
        font-weight: 700;
        font-size: 0.85rem;
        min-width: 28px;
        height: 28px;
        border-radius: 99px;
        padding: 0 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        z-index: 10;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .tab-btn { transition: all 0.2s ease-in-out; }
    .tab-btn.active {
        background-color: #ef4444;
        color: #ffffff;
        box-shadow: 0 2px 10px rgba(220,38,38,0.4);
    }

    .loader {
        border: 6px solid #262626; 
        border-top: 6px solid #ef4444; 
        border-radius: 50%;
        width: 60px;
        height: 60px;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>

        }

    async function startCamera() {
        stopLivePreviewLoop(); 
        try {
            if (!video.srcObject) {
                const videoConstraints = {
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                    facingMode: 'user'
                };
                const stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false });
                video.srcObject = stream;
                await video.play();
            }
            return true;
        } catch (err) {
            console.error("Camera access error (ideal):", err);
            if (err.name === "OverconstrainedError") {
                console.warn("Ideal resolution failed. Trying default camera...");
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                    video.srcObject = fallbackStream;
                    await video.play();
                    return true;
                } catch (fallbackErr) {
                    console.error("Fallback camera error:", fallbackErr);
                    alert("Hindi talaga ma-access ang camera. Pakisuri ang iyong settings.");
                    return false;
                }
            } else if (err.name === "NotAllowedError") {
                alert("Kailangan mong payagan ang pag-access sa camera. I-refresh ang page at i-click ang 'Allow'.");
            } else {
                alert("Could not access the camera. Please allow camera permissions.");
            }
            return false;
        }
    }

    function updateCameraViewport() {
        const parent = document.getElementById('booth-main-area');
        const container = document.getElementById('camera-container');
        
        if (!parent || !container) return;

        const config = layoutConfig[appState.layout];
        const guideIndex = appState.currentShotIndex < config.shots ? appState.currentShotIndex : 0;
        const guide = config.guides[guideIndex];
        
        const targetRatio = (config.w * guide.w) / (config.h * guide.h);
        const parentW = parent.clientWidth - 32; 
        const parentH = parent.clientHeight - 32; 

        let newW = parentW;
        let newH = parentW / targetRatio;

        if (newH > parentH) {
            newH = parentH;
            newW = parentH * targetRatio;
        }

        container.style.width = `${newW}px`;
        container.style.height = `${newH}px`;
        container.style.aspectRatio = `${targetRatio}`;
    }
    
    window.addEventListener('resize', updateCameraViewport);

    }

                method: 'GET',
                cache: 'no-store', 
                headers: {
                    'Cache-Control': 'no-cache',
                    'Pragma': 'no-cache'
                }
            });
            
            if (!response.ok) throw new Error('Could not connect to server');
            
            const data = await response.json();
            appState.sessionLayouts = data.layouts || [];

    function updateStartScreen() {
        const layoutCounts = {};
        appState.sessionLayouts.forEach(layout => {

        if (appState.sessionLayouts.length === 0) {
            startTitle.textContent = 'NO ACTIVE SESSION PLEASE CONTACT THE OWNER';

            startTitle.textContent = `SELECT YOUR LAYOUT (${appState.sessionLayouts.length} AVAILABLE)`;
        }

        layoutButtons.forEach(button => {
            const layout = button.dataset.layout;
            const count = layoutCounts[layout] || 0;
            const counter = button.querySelector('.layout-counter');

            if (count > 0) {
                button.disabled = false;
                counter.textContent = count;
                counter.style.display = 'flex';
            } else {
                button.disabled = true;
                counter.style.display = 'none';
            }
        });
    }
    
    function waitForElementVisible(element) {
        return new Promise(resolve => {
            if (element.clientWidth > 0 && element.clientHeight > 0) {
                return resolve();
            }
            const checkVisibility = () => {
                if (element.clientWidth > 0 && element.clientHeight > 0) {
                    resolve();
                } else {
                    requestAnimationFrame(checkVisibility);
                }
            };
            requestAnimationFrame(checkVisibility);
        });
    }

    function drawFrameBackground(ctx, width, height, style, color) {
        if (style === 'solid') {
            ctx.fillStyle = color || 'white';
            ctx.fillRect(0, 0, width, height);
            return;
        }

        let gradient;
        
        if (style === 'gradient-rainbow') {
            gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, '#ff0000');
            gradient.addColorStop(0.16, '#ff7f00');
            gradient.addColorStop(0.33, '#ffff00');
            gradient.addColorStop(0.5, '#00ff00');
            gradient.addColorStop(0.66, '#0000ff');
            gradient.addColorStop(0.83, '#4b0082');
            gradient.addColorStop(1, '#9400d3');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        } else if (style === 'style-polaroid') {
            ctx.fillStyle = '#fdfbf7'; 
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#efece6';
            ctx.fillRect(0, height * 0.98, width, height * 0.02); 
        } else if (style === 'style-spotify') {
            ctx.fillStyle = '#191414'; 
            ctx.fillRect(0, 0, width, height);
            
            const barY = height * 0.94;
            ctx.fillStyle = '#535353';
            ctx.fillRect(width * 0.1, barY, width * 0.8, height * 0.005);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(width * 0.1, barY, width * 0.25, height * 0.005);
            ctx.beginPath(); ctx.arc(width * 0.35, barY + (height * 0.0025), height * 0.008, 0, Math.PI*2); ctx.fill();
            
            const controlsY = height * 0.88;
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(width * 0.5, controlsY, height * 0.03, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.moveTo(width*0.49, controlsY - height*0.01); ctx.lineTo(width*0.515, controlsY); ctx.lineTo(width*0.49, controlsY + height*0.01); ctx.fill();
            
            ctx.fillStyle = '#b3b3b3';
            ctx.beginPath(); ctx.moveTo(width*0.4, controlsY); ctx.lineTo(width*0.42, controlsY - height*0.015); ctx.lineTo(width*0.42, controlsY + height*0.015); ctx.fill();
            ctx.beginPath(); ctx.moveTo(width*0.6, controlsY); ctx.lineTo(width*0.58, controlsY - height*0.015); ctx.lineTo(width*0.58, controlsY + height*0.015); ctx.fill();

        } else if (style === 'style-instagram') {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, width, height);
            
            ctx.strokeStyle = '#dbdbdb';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, height*0.08); ctx.lineTo(width, height*0.08); ctx.stroke();
            
            ctx.fillStyle = '#262626';
            ctx.beginPath(); ctx.arc(width*0.08, height*0.04, height*0.02, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#efefef';
            ctx.fillRect(width*0.14, height*0.03, width*0.3, height*0.02);
            
            const actionY = height * 0.95;
            ctx.strokeStyle = '#262626'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(width*0.1, actionY, height*0.015, 0, Math.PI*2); ctx.stroke(); 
            ctx.beginPath(); ctx.arc(width*0.2, actionY, height*0.015, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.arc(width*0.9, actionY, height*0.015, 0, Math.PI*2); ctx.fill(); 

        } else if (style === 'gradient-christmas') {
            gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, '#8f1111'); 
            gradient.addColorStop(0.5, '#0f3d0f'); 
            gradient.addColorStop(1, '#8f1111'); 
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
            for(let i=0; i<30; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const r = Math.random() * (width * 0.01);
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

        } else if (style === 'gradient-valentine') {
            gradient = ctx.createRadialGradient(width/2, height/2, width/4, width/2, height/2, width);
            gradient.addColorStop(0, '#ffb7b2'); 
            gradient.addColorStop(1, '#ff6961'); 
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
            for(let i=0; i<15; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const size = width * 0.02;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.bezierCurveTo(x, y - size/2, x - size, y - size/2, x - size, y);
                ctx.bezierCurveTo(x - size, y + size, x, y + size*2, x, y + size*2);
                ctx.bezierCurveTo(x, y + size*2, x + size, y + size, x + size, y);
                ctx.bezierCurveTo(x + size, y - size/2, x, y - size/2, x, y);
                ctx.fill();
            }

        } else if (style === 'gradient-easter') {
            gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#ffdfba'); 
            gradient.addColorStop(0.5, '#ffffba'); 
            gradient.addColorStop(1, '#bae1ff'); 
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            const colors = ['#ffb3ba', '#baffc9', '#bae1ff', '#ffffba'];
            for(let i=0; i<40; i++) {
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                const x = Math.random() * width;
                const y = Math.random() * height;
                const r = Math.random() * (width * 0.015);
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

        } else if (style === 'gradient-halloween') {
            gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#ff6600'); 
            gradient.addColorStop(0.4, '#2e003e'); 
            gradient.addColorStop(1, '#000000'); 
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0,0); ctx.lineTo(width*0.2, height*0.2);
            ctx.moveTo(width,0); ctx.lineTo(width*0.8, height*0.2);
            ctx.stroke();

        } else if (style === 'gradient-summer') {
            gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#4fc3f7'); 
            gradient.addColorStop(0.6, '#fff176'); 
            gradient.addColorStop(1, '#ffcc80'); 
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath(); ctx.arc(width*0.9, height*0.05, width*0.04, 0, Math.PI*2); ctx.fill();
            
            ctx.strokeStyle = "rgba(255,255,255,0.5)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < width; i+=20) {
                ctx.moveTo(i, height*0.95);
                ctx.quadraticCurveTo(i+10, height*0.94, i+20, height*0.95);
            }
            ctx.stroke();

        } else if (style === 'pattern-birthday') {
            ctx.fillStyle = '#283593';
            ctx.fillRect(0, 0, width, height);
            
            const colors = ['#ffeb3b', '#f44336', '#4caf50', '#2196f3'];
            for(let i=0; i<80; i++) {
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                const x = Math.random() * width;
                const y = Math.random() * height;
                const w = Math.random() * (width * 0.015);
                const h = Math.random() * (height * 0.01);
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(Math.random() * Math.PI);
                ctx.fillRect(0, 0, w, h);
                ctx.restore();
            }

        } else if (style === 'pattern-film') {
            ctx.fillStyle = '#111'; 
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#ffffff';
            const holeSize = width * 0.03; 
            const spacing = holeSize * 2;
            
            for(let y = 0; y < height; y += spacing) {
                ctx.fillRect(width * 0.01, y, holeSize, holeSize/1.5);
            }
            for(let y = 0; y < height; y += spacing) {
                ctx.fillRect(width - (width*0.01) - holeSize, y, holeSize, holeSize/1.5);
            }
        }
    }

    function drawLivePreview() {
        const config = layoutConfig[appState.layout];
        if (!config) {
            console.error("Invalid layout config for:", appState.layout);
            return;
        }
        const ctx = livePreviewCanvas.getContext('2d');
        const parentWidth = livePreviewCanvas.parentElement.clientWidth;
        
        if (parentWidth === 0) { 
             livePreviewLoopId = requestAnimationFrame(drawLivePreview);
             return;
        }

        const canvasW = parentWidth;
        const canvasH = parentWidth / (config.w / config.h);
        livePreviewCanvas.width = canvasW * 2;
        livePreviewCanvas.height = canvasH * 2;
        livePreviewCanvas.style.height = `${canvasH}px`; 
        livePreviewCanvas.style.width = `${canvasW}px`;
        
        ctx.fillStyle = '#171717';
        ctx.fillRect(0,0, livePreviewCanvas.width, livePreviewCanvas.height);

        config.guides.forEach((g, i) => {
             const dx = livePreviewCanvas.width * g.x;
             const dy = livePreviewCanvas.height * g.y;
             const dw = livePreviewCanvas.width * g.w;
             const dh = livePreviewCanvas.height * g.h;
             
             if (!appState.staticShotImages[i]) {
                if (i === appState.currentShotIndex && video.videoWidth > 0 && !video.paused) {
                    drawImageCropped(ctx, video, dx, dy, dw, dh);
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 8;
                    ctx.strokeRect(dx, dy, dw, dh);
                } else {
                    ctx.fillStyle = "#262626";
                    ctx.fillRect(dx, dy, dw, dh);
                }
             }
        });

        appState.staticShotImages.forEach((img, i) => {
            const g = config.guides[i];
            if(g) drawImageCropped(ctx, img, livePreviewCanvas.width * g.x, livePreviewCanvas.height * g.y, livePreviewCanvas.width * g.w, livePreviewCanvas.height * g.h);
        });

        if (appState.frameImage) {
            ctx.drawImage(appState.frameImage, 0, 0, livePreviewCanvas.width, livePreviewCanvas.height);
        }

        livePreviewLoopId = requestAnimationFrame(drawLivePreview);
    }

    async function takeSingleShot() {
        updateBoothControls('processing');
        instructionsText.textContent = 'READY...';
        
        const framesPromise = new Promise(async (resolve) => {
            const frames = [];
            const captureInterval = setInterval(() => {
                if (video.videoWidth === 0) return; 
                captureCanvas.width = video.videoWidth;
                captureCanvas.height = video.videoHeight;
                const ctx = captureCanvas.getContext('2d');
                ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight);
                frames.push(captureCanvas.toDataURL('image/jpeg', 0.4));
            }, 80); 

            await showOverlayText('LOOK AT THE CAMERA!', 1200);
            
            audioCountdown.currentTime = 0;
            audioCountdown.play().catch(e => console.error("Audio play failed:", e)); 
            
            await showOverlayText('3', 1000); 
            await showOverlayText('2', 1000); 
            await showOverlayText('1', 1000); 
            
            await new Promise(r => setTimeout(r, 50)); 

            clearInterval(captureInterval);
            resolve(frames.slice(-18)); 
        });

        const frames = await framesPromise;
        
        flashEffect.classList.add('flash');
        setTimeout(() => flashEffect.classList.remove('flash'), 350);
        
        appState.boomerangCollections.push(frames);
        const staticShotDataUrl = frames[frames.length - 1]; 
        appState.staticShots.push(staticShotDataUrl);
        appState.staticShotImages.push(await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = staticShotDataUrl; }));
        
        appState.currentShotIndex++;
        updateShotIndicator(appState.currentShotIndex-1);

        const totalShots = layoutConfig[appState.layout].shots;

        if (appState.currentShotIndex < totalShots) {
            updateBoothControls('next');
            
            updateCameraViewport();

            instructionsText.textContent = 'NICE SHOT!';
            updateShotIndicator(appState.currentShotIndex);
            drawLivePreview(); 
        } else {
            updateShotIndicator(totalShots);
            instructionsText.textContent = 'ALL DONE! GENERATING PREVIEW...';
            
            drawLivePreview(); 
            stopLivePreviewLoop(); 
            
            await new Promise(resolve => setTimeout(resolve, 1500));
            await showPreviewScreen();
        }
    }

    function drawImageCropped(ctx, img, dx, dy, dw, dh) {
        const imgRatio = (img.videoWidth || img.width) / (img.videoHeight || img.height);
        const boxRatio = dw / dh;
        let sw = (img.videoWidth || img.width);
        let sh = (img.videoHeight || img.height);
        let sx = 0, sy = 0;
        
        if (imgRatio > boxRatio) {
            sw = sh * boxRatio;
            sx = ((img.videoWidth || img.width) - sw) / 2;
        } else {
            sh = sw / boxRatio;
            sy = ((img.videoHeight || img.height) - sh) / 2;
        }
        ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
    }

    async function generateAndSaveVideo(baseFilename) {
        console.log('Starting Video generation...');
        savingStatusMessage.textContent = 'GENERATING VIDEO...';

        return new Promise(async (resolve, reject) => {
            try {
                const config = layoutConfig[appState.layout];
                
                const VIDEO_WIDTH = 720; 
                const VIDEO_HEIGHT = VIDEO_WIDTH / (config.w / config.h);

                const vidCanvas = document.createElement('canvas');
                vidCanvas.width = VIDEO_WIDTH;
                vidCanvas.height = VIDEO_HEIGHT;
                const ctx = vidCanvas.getContext('2d');

                const bgCanvas = document.createElement('canvas');
                bgCanvas.width = VIDEO_WIDTH;
                bgCanvas.height = VIDEO_HEIGHT;
                const bgCtx = bgCanvas.getContext('2d');
                
                drawFrameBackground(bgCtx, VIDEO_WIDTH, VIDEO_HEIGHT, appState.frameStyle, appState.frameColor);

                if (appState.logoImage) {
                    let logoH_percent = 0.08; 
                    let logoY_percent = 0.02; 
                    
                    if (appState.layout === 'spotlight-3' || appState.layout === 'grid-6-landscape') {
                        logoH_percent = 0.18; 
                        logoY_percent = 0.01; 
                    }

                    const logoH = VIDEO_HEIGHT * logoH_percent; 
                    const logoAspect = appState.logoImage.width / appState.logoImage.height;
                    const logoW = logoH * logoAspect;
                    const logoX = (VIDEO_WIDTH - logoW) / 2;
                    const logoY = VIDEO_HEIGHT - logoH - (VIDEO_HEIGHT * logoY_percent); 
                    
                    bgCtx.drawImage(appState.logoImage, logoX, logoY, logoW, logoH);
                }

                const allFrameImages = await Promise.all(
                    appState.boomerangCollections.map(collection => 
                        Promise.all(collection.map(src => new Promise(res => { 
                            const i = new Image(); 
                            i.onload = () => res(i); 
                            i.src = src; 
                        })))
                    )
                );
                
                const longestCollectionLength = Math.max(0, ...allFrameImages.map(c => c.length));
                if (longestCollectionLength === 0) throw new Error("No frames found for Video.");

                let frameSequence = [];
                for (let i = 0; i < longestCollectionLength; i++) { frameSequence.push(i); }
                for (let i = longestCollectionLength - 2; i > 0; i--) { frameSequence.push(i); }

                let mimeType = 'video/webm';
                if (MediaRecorder.isTypeSupported("video/mp4")) {
                    mimeType = "video/mp4";
                } else if (MediaRecorder.isTypeSupported("video/webm;codecs=h264")) {
                    mimeType = "video/webm;codecs=h264";
                } else if (MediaRecorder.isTypeSupported("video/webm;codecs=vp9")) {
                    mimeType = "video/webm;codecs=vp9";
                }

                const stream = vidCanvas.captureStream(30); 
                const recorder = new MediaRecorder(stream, { mimeType: mimeType, videoBitsPerSecond: 2500000 });
                
                const chunks = [];
                recorder.ondataavailable = e => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                recorder.onstop = () => {
                    console.log('Video recording finished.');
                    
                    const blob = new Blob(chunks, { type: mimeType });
                    
                    appState.localVideoBlobUrl = URL.createObjectURL(blob);
                    console.log("Generated local blob URL:", appState.localVideoBlobUrl);
                    
                    savingStatusMessage.textContent = 'GENERATED QR CODE';
                    const formData = new FormData();
                    
                    let fileExtension = '.webm';
                    if (mimeType.includes('mp4')) {
                        fileExtension = '.mp4';
                    }
                    
                    const videoFilename = baseFilename.replace(/\.[^/.]+$/, "") + fileExtension;
                    
                    formData.append('filename', videoFilename); 
                    formData.append('videoData', blob, videoFilename);

                    fetch('admin/save_video.php', {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => {
                        if (!response.ok) throw new Error('Failed to save Video on server.');
                        return response.text();
                    })
                    .then(text => {
                        console.log("Upload success:", text);
                        appState.videoUrl = "uploads/" + videoFilename; 
                        
                        if (!document.getElementById('result-screen').classList.contains('hidden')) {
                            savingStatusMessage.textContent = 'SAVED!';
                        }
                        resolve(); 
                    })
                    .catch(err => {
                        console.error("Upload failed but local preview works:", err);
                        reject(err); 
                    }); 
                };

                recorder.start();

                let sequenceIndex = 0;
                let loopCount = 0;
                const maxLoops = 3;
                const fps = 15;
                const interval = 1000 / fps;

                function drawFrame() {
                    if (loopCount >= maxLoops) {
                        recorder.stop();
                        return;
                    }

                    const frameIndex = frameSequence[sequenceIndex];

                    ctx.drawImage(bgCanvas, 0, 0);

                    ctx.filter = appState.frameFilter || 'none';
                    config.guides.forEach((g, i) => {
                        const currentCollection = allFrameImages[i];
                        if (currentCollection && currentCollection.length > 0) {
                            const img = currentCollection[frameIndex % currentCollection.length];
                            drawImageCropped(ctx, img, vidCanvas.width * g.x, vidCanvas.height * g.y, vidCanvas.width * g.w, vidCanvas.height * g.h);
                        }
                    });
                    ctx.filter = 'none';

                    if (appState.frameImage) {
                        ctx.drawImage(appState.frameImage, 0, 0, vidCanvas.width, vidCanvas.height);
                    }

                    sequenceIndex++;
                    if (sequenceIndex >= frameSequence.length) {
                        sequenceIndex = 0;
                        loopCount++;
                    }

                    setTimeout(drawFrame, interval);
                }

                drawFrame();

            } catch (err) {
                reject(err); 
            }
        });
    }

    async function generateAndSaveFinalImage() {
        savingStatusMessage.textContent = 'SAVING IMAGE...';
        qrCodeContainer.innerHTML = '...';
        
        await new Promise(resolve => setTimeout(resolve, 100)); 

        const config = layoutConfig[appState.layout];
        const printCtx = finalCanvas.getContext('2d');
        const DPI = 300;
        finalCanvas.width = config.w * DPI;
        finalCanvas.height = config.h * DPI;
        
        drawFrameBackground(printCtx, finalCanvas.width, finalCanvas.height, appState.frameStyle, appState.frameColor);
        
        printCtx.filter = appState.frameFilter || 'none';
        appState.staticShotImages.forEach((img, i) => {
            const g = config.guides[i];
            if(g) drawImageCropped(printCtx, img, finalCanvas.width * g.x, finalCanvas.height * g.y, finalCanvas.width * g.w, finalCanvas.height * g.h);
        });
        printCtx.filter = 'none';
        
        if (appState.frameImage) {
            printCtx.drawImage(appState.frameImage, 0, 0, finalCanvas.width, finalCanvas.height);
        }

        if (appState.logoImage) {
            let logoH_percent = 0.08; 
            let logoY_percent = 0.02; 
            
            if (appState.layout === 'spotlight-3' || appState.layout === 'grid-6-landscape') {
                logoH_percent = 0.18; 
                logoY_percent = 0.01; 
            }

            const logoH = finalCanvas.height * logoH_percent; 
            const logoAspect = appState.logoImage.width / appState.logoImage.height;
            const logoW = logoH * logoAspect;
            const logoX = (finalCanvas.width - logoW) / 2;
            const logoY = finalCanvas.height - logoH - (finalCanvas.height * logoY_percent); 
            
            printCtx.drawImage(appState.logoImage, logoX, logoY, logoW, logoH);
        }

        appState.finalImage = finalCanvas.toDataURL('image/png');
        appState.fileUrl = null; 
        
        savingStatusMessage.textContent = 'UPLOADING...';

        try {
            const response = await fetch('admin/save_image.php', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, 
                body: 'imageData=' + encodeURIComponent(appState.finalImage) 
            });
            
            if (!response.ok) throw new Error('Server error during print save');
            const rawResponse = await response.text();
            
            if (rawResponse && rawResponse.startsWith('uploads/')) {
                
                appState.fileUrl = rawResponse; 
                
                await fetch('admin/use_session.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'layout=' + encodeURIComponent(appState.currentSessionLayout)
                });

                const usedLayoutIndex = appState.sessionLayouts.indexOf(appState.currentSessionLayout);
                if (usedLayoutIndex > -1) {
                    appState.sessionLayouts.splice(usedLayoutIndex, 1);
                }

                const baseFilename = appState.fileUrl.split('/').pop(); 
                
                await generateAndSaveVideo(baseFilename);

            } else {
                throw new Error(rawResponse || 'Failed to get file URL from PHP');
            }

        } catch (error) {
            console.error('Error during save process:', error);
            savingStatusMessage.textContent = 'ERROR SAVING.';
            qrCodeContainer.innerHTML = 'Error';
        }
        
        await showFinalPreviewScreen(appState.fileUrl);
    }

            resultPrintTab.classList.remove('active');
            
            const vid = resultBoomerangContainer.querySelector('video');
            if(vid) vid.play().catch(e=>{});

        } else { 
            resultBoomerangContainer.classList.add('hidden');
            resultBoomerangContainer.classList.remove('flex');

            resultPrintContainer.classList.remove('hidden');
            resultPrintContainer.classList.add('flex');

            resultBoomerangTab.classList.remove('active');
            resultPrintTab.classList.add('active');
            
            const vid = resultBoomerangContainer.querySelector('video');
            if(vid) vid.pause();
        }
    }

    function generateQRCode(url, container) {
        try {
            if (typeof qrcode === 'undefined') {
                throw new Error("qrcode.js library is not loaded. Check path: js/qrcode.js");
            }
            
            console.log("Attempting to generate QR for URL:", url); 
            
            container.innerHTML = ''; 
            const typeNumber = 0; 
            const errorCorrectionLevel = 'L'; 
            const qr = qrcode(typeNumber, errorCorrectionLevel);
            qr.addData(url);
            qr.make();
            
            const imgTag = qr.createImgTag(6, 0); 
            
            const imgEl = document.createElement('div');
            imgEl.innerHTML = imgTag;
            const qrImage = imgEl.firstChild;
            
            qrImage.style.width = '100%';
            qrImage.style.height = 'auto';
            qrImage.style.imageRendering = 'pixelated'; 
            
            container.appendChild(qrImage);
            
        } catch (e) {
            console.error('QR Code generation FAILED:', e.message); 
            container.innerHTML = 'QR Error';
        }
    }

    layoutButtons.forEach(b => b.addEventListener('click', () => { 
        appState.currentSessionLayout = b.dataset.layout; 
        appState.layout = b.dataset.layout; 
        appState.retriesLeft = MAX_RETRIES; 
        setupBooth(); 
    }));

    retakeBtn.addEventListener('click', () => {
        stopLivePreviewLoop();
        if (appState.retriesLeft > 0) {
            appState.retriesLeft--;
            setupBooth(); 
        }
    });

    confirmFrameBtn.addEventListener('click', async () => {
        stopLivePreviewLoop();
        stopCamera();
        await loadFramesForSelection(); 
    });

    backToPreviewBtn.addEventListener('click', () => {
        showPreviewScreen(); 
    });

    confirmSaveBtn.addEventListener('click', async () => {
        showScreen('loading');
        await new Promise(resolve => setTimeout(resolve, 50));
        await generateAndSaveFinalImage();
    });

    nextSessionBtn.addEventListener('click', () => {
        showScreen('start');
        updateStartScreen();
    });

    resultBoomerangTab.addEventListener('click', () => showResultTab('boomerang'));
    resultPrintTab.addEventListener('click', () => showResultTab('print'));
    
    document.addEventListener('DOMContentLoaded', initializeApp);

</script>

document.onkeydown = function(e) {
    if(e.keyCode == 123) {
        return false;
    }
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) {
        return false;
    }
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) {
        return false;
    }
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) {
        return false;
    }
    if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) {
        return false;
    }
}
